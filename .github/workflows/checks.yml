name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Actions are pinned to full commit SHAs (security review L-13), resolved on
# 2026-11-05 with `git ls-remote` against each action's own repository. Both are
# the current release and run on Node 24 (runs.using in action.yml at that tag):
#   actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   denoland/setup-deno v2.0.5 -> 22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
# To update: `git ls-remote https://github.com/<owner>/<action> refs/tags/<tag>`
# (use the `^{}` line for an annotated tag) and replace the SHA and comment.
#
# Repository setting: sha_pinning_required is on, so an action not pinned to a
# full SHA fails the run. allowed_actions stays "all": patterns_allowed applies
# to public repositories only, so "selected" could not allow setup-deno here.

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.8

      # Security review M-6: pull request code must not run with the secret, so
      # the tests get it on pushes to main only. Elsewhere the two tests that
      # need it show as ignored.
      - name: Run tests
        env:
          PRIVACY_PATTERNS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.PRIVACY_PATTERNS || '' }}
        run: deno test --no-lock --allow-read --allow-run --allow-env test/

  privacy:
    name: privacy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Security review M-6: a pull request must not run its own copy of the
      # checker while the PRIVACY_PATTERNS secret is in the environment, so on
      # pull requests the checker comes from the base commit. On pushes to main
      # the pushed checker is the reviewed one.
      - name: Take the checker from the base commit on pull requests
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git show "$PR_BASE_SHA:scripts/privacy-check.py" > "$RUNNER_TEMP/privacy-check.py"
          else
            cp scripts/privacy-check.py "$RUNNER_TEMP/privacy-check.py"
          fi

      # REQUIRE_PATTERNS: a push to main fails (not warns) when the secret is
      # missing. Fork pull requests get no secrets; they still run the generic
      # checks (IPs, e-mails, home paths, tokens, image metadata, commits).
      - name: Scan diff, changed files and commits
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
          REQUIRE_PATTERNS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        # -I: isolated mode (no PYTHON* variables, no script-dir imports).
        run: python3 -u -I "$RUNNER_TEMP/privacy-check.py"
