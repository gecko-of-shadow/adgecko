<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adgecko</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="top">
      <img id="brand-icon" src="../icons/icon48-working.png" alt="" width="40" height="40" data-glow="on">
      <h1 id="product">Adgecko</h1>
      <button id="open-settings" class="gear" type="button" aria-label="Settings" title="Settings">&#9881;&#xFE0E;</button>
    </header>

    <section id="welcome" class="card welcome" aria-labelledby="welcome-title" hidden>
      <p id="welcome-title" class="card-title">You're protected</p>
      <p class="note">Nothing to set up. Ads and known bad sites are blocked while you browse.</p>
      <button id="welcome-close" type="button" class="link">Got it</button>
    </section>

    <p id="site-host" class="host">Checking this page…</p>
    <p id="site-status" class="status" role="status" aria-live="polite"></p>

    <section class="card" aria-labelledby="fix-title">
      <p id="fix-title" class="card-title">Something broke?</p>
      <button id="fix-site" type="button" class="primary">Fix this site</button>
      <div id="fix-ask" role="group" aria-labelledby="fix-question" hidden>
        <p id="fix-question" class="question">Did that fix it? Reload the page and look.</p>
        <div class="pair">
          <button id="fix-yes" type="button" class="primary">Yes</button>
          <button id="fix-no" type="button" class="secondary">No</button>
        </div>
      </div>
      <p id="fix-note" class="note" aria-live="polite"></p>
    </section>

    <button id="allow-site" type="button" class="primary big" aria-pressed="false">Allow this site</button>
    <p id="page-status" class="note" aria-live="polite"></p>

    <details id="more">
      <summary>Show more</summary>
      <p id="signal-line" class="note"></p>
      <p id="lists-status" class="note"></p>
      <p id="feed-status" class="note"></p>
      <p id="version-line" class="note"></p>
      <p class="note credit">List credit: The EasyList authors.</p>
    </details>
  </main>
  <script src="popup.js"></script>
</body>
</html>
