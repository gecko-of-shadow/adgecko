<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="128" height="128" data-state="normal">
  <!--
    Gecko Adblock icon, concept E (picked by the owner 2026-11-02, docs/design/icon-E-gecko-snap.jpg):
    a neon purple gecko head in line art, tongue snapping a glitchy pixel "ad".
    Hand-written vector recreation (no embedded picture). Source for icons/icon48*.png and
    icons/icon128*.png; the 16 px icons come from gecko-16.svg. Rebuild: node scripts/build-icons.mjs
    data-state on the root picks the variant:
      normal  = full purple art, pixel "ad" in the same purple
      working = same art, pixel "ad" lit brighter (the toolbar icon while blocking is on)
      off     = grey art, dimmer tongue, unlit pixels
  -->
  <defs>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feComponentTransfer in="b" result="bd"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="bd"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="grey" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.3 0.55 0.15 0 0  0.3 0.55 0.15 0 0  0.3 0.55 0.15 0 0  0 0 0 1 0"/>
    </filter>
  </defs>
  <style>
    .tile { fill: #1c1b21; }
    .ln { fill: none; stroke: #9d5cff; stroke-linecap: round; stroke-linejoin: miter; stroke-miterlimit: 12; }
    .fill { fill: #9d5cff; }
    .iris { fill: #a96dff; }
    .dark { fill: #1c1b21; }
    .px { fill: #8f52f5; }
    .px2 { fill: #a46bff; }
    .px3 { fill: #6c3fc0; }
    svg[data-state="working"] .px { fill: #eadbff; }
    svg[data-state="working"] .px2 { fill: #ffffff; }
    svg[data-state="working"] .px3 { fill: #d4b4ff; }
    svg[data-state="off"] #art { filter: url(#grey); }
    svg[data-state="off"] .tongue { opacity: 0.55; }
    svg[data-state="off"] .pixels { opacity: 0.35; }
    svg[data-state="off"] #ink { filter: none; }
  </style>
  <g id="art">
    <rect class="tile" x="40" y="36" width="944" height="948" rx="150"/>
    <g id="ink" filter="url(#glow)">
      <!-- head outline: snout, forehead, spiky crest down the back of the head -->
      <path class="ln" stroke-width="30" d="M196 566 C180 552 174 530 177 506 L186 488 L243 412 L262 336 L330 304 C380 272 430 254 472 246 L556 232 L524 262 C570 262 620 268 662 276 L614 300 L734 360 L672 372 L716 430 L760 446 L702 448 L728 512 L746 556 L712 532 L692 612"/>
      <!-- back of the neck with its small spike -->
      <path class="fill" d="M664 654 L690 668 C664 714 620 754 556 782 C604 744 640 704 664 654 Z"/>
      <path class="fill" d="M622 722 L664 708 L628 740 Z"/>
      <!-- front of the neck -->
      <path class="fill" d="M402 594 C458 606 494 644 488 688 C480 728 440 762 386 792 C424 752 456 718 462 686 C466 652 442 630 400 618 Z"/>
      <path class="fill" d="M458 640 L486 624 L470 660 Z"/>
      <!-- lower jaw -->
      <path class="ln" stroke-width="28" d="M214 578 C236 604 262 622 292 624 L404 606 L486 592"/>
      <!-- mouth and cheek -->
      <path class="ln" stroke-width="28" d="M196 566 C230 578 270 578 312 562 C382 536 452 504 520 482"/>
      <path class="ln" stroke-width="20" d="M486 474 C508 468 532 470 562 490"/>
      <path class="ln" stroke-width="20" d="M642 478 C650 512 636 540 610 556"/>
      <path class="ln" stroke-width="16" d="M238 590 C300 584 380 566 440 548"/>
      <!-- nostril -->
      <path class="ln" stroke-width="18" d="M228 534 L242 512 L258 500"/>
      <!-- forehead ridges -->
      <path class="ln" stroke-width="18" d="M322 312 L300 350"/>
      <path class="ln" stroke-width="18" d="M280 384 L254 408"/>
      <!-- brow / upper lid -->
      <path class="ln" stroke-width="24" d="M342 386 L326 424 L336 440 C384 398 444 344 522 326"/>
      <!-- eye: almond, purple iris, slit pupil, lower lid -->
      <path class="iris" d="M410 438 C440 404 466 374 492 356 C500 386 490 412 464 428 C448 436 430 438 410 438 Z"/>
      <path class="dark" d="M430 390 C421 404 421 418 428 432 C436 420 438 404 430 390 Z"/>
      <path class="ln" stroke-width="16" d="M338 454 C392 454 452 448 506 400"/>
    </g>
    <!-- tongue flicking out to the right, curling up into the pixel "ad" -->
    <path class="ln tongue" stroke-width="36" filter="url(#glow)" d="M420 528 C480 514 540 536 590 580 C640 626 690 660 760 662 C812 662 846 640 846 604 C846 588 838 578 822 574"/>
    <!-- the glitchy pixel "ad" being snapped -->
    <g class="pixels" transform="translate(826 536) scale(1.6) translate(-818 -535)">
      <rect class="px" x="804" y="485" width="10" height="10"/>
      <rect class="px" x="833" y="495" width="12" height="12"/>
      <rect class="px" x="785" y="504" width="14" height="14"/>
      <rect class="px2" x="815" y="515" width="15" height="15"/>
      <rect class="px" x="846" y="516" width="14" height="14"/>
      <rect class="px" x="771" y="531" width="14" height="13"/>
      <rect class="px2" x="799" y="529" width="16" height="16"/>
      <rect class="px3" x="831" y="529" width="15" height="15"/>
      <rect class="px" x="799" y="545" width="16" height="14"/>
      <rect class="px" x="854" y="544" width="13" height="13"/>
      <rect class="px" x="784" y="558" width="15" height="15"/>
      <rect class="px3" x="858" y="580" width="8" height="7"/>
    </g>
  </g>
</svg>
