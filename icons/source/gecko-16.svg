<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges" data-state="normal">
  <!--
    16 px toolbar cut of gecko.svg (concept E), drawn pixel by pixel: fewer details, 1 px lines on
    whole pixels, no glow, no blur. Source for icons/icon16*.png. Rebuild: node scripts/build-icons.mjs
    data-state on the root: "normal", "working" (pixel "ad" lit brighter) or "off" (grey, no lit pixels).

    Pixel map (_ transparent, . tile, P line, I eye, t tongue, A pixel "ad"):
      __............__
      _.........P...._
      .......PPP..P...
      .....PP...PP....
      ....P......P.P..
      ...P..PPP...P...
      ..P..P.II..P....
      .P.........P.P..
      .PPPPPPP....P.A.
      ..P...ttt..P.A.A
      ..PPPPP..ttt..A.
      ......P.....ttt.
      .....P....P.....
      ....P....P......
      _.............._
      __............__
  -->
  <defs>
    <filter id="grey" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.3 0.55 0.15 0 0  0.3 0.55 0.15 0 0  0.3 0.55 0.15 0 0  0 0 0 1 0"/>
    </filter>
  </defs>
  <style>
    .tile { fill: #1c1b21; }
    .ln { fill: #a56eff; }
    .eye { fill: #d9bdff; }
    .tongue { fill: #a56eff; }
    .px { fill: #9a5cff; }
    svg[data-state="working"] .px { fill: #f1e4ff; }
    svg[data-state="off"] #art { filter: url(#grey); }
    svg[data-state="off"] .tongue { fill: #7a52c0; }
    svg[data-state="off"] .px { fill: #4a3d66; }
  </style>
  <g id="art">
    <path class="tile" d="M2 0h12v1h-12zM1 1h14v1h-14zM0 2h16v12h-16zM1 14h14v1h-14zM2 15h12v1h-12z"/>
    <path class="ln" d="M10 1h1v1h-1zM7 2h3v1h-3zM12 2h1v1h-1zM5 3h2v1h-2zM10 3h2v1h-2zM4 4h1v1h-1zM11 4h1v1h-1zM13 4h1v1h-1zM3 5h1v1h-1zM6 5h3v1h-3zM12 5h1v1h-1zM2 6h1v1h-1zM5 6h1v1h-1zM11 6h1v1h-1zM1 7h1v1h-1zM11 7h1v1h-1zM13 7h1v1h-1zM1 8h7v1h-7zM12 8h1v1h-1zM2 9h1v1h-1zM11 9h1v1h-1zM2 10h5v1h-5zM6 11h1v1h-1zM5 12h1v1h-1zM10 12h1v1h-1zM4 13h1v1h-1zM9 13h1v1h-1z"/>
    <path class="eye" d="M7 6h2v1h-2z"/>
    <path class="tongue" d="M6 9h3v1h-3zM9 10h3v1h-3zM12 11h3v1h-3z"/>
    <path class="px" d="M14 8h1v1h-1zM13 9h1v1h-1zM15 9h1v1h-1zM14 10h1v1h-1z"/>
  </g>
</svg>
